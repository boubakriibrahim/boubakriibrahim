  <rect width="1200" height="390" rx="26" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="334" rx="22" fill="#0a1220" stroke="#253a5d" stroke-width="1.5"/>

  <circle cx="55" cy="55" r="6" fill="#ff6b6b"/>
  <circle cx="77" cy="55" r="6" fill="#ffd166"/>
  <circle cx="99" cy="55" r="6" fill="#45d483"/>
  <text x="125" y="61" fill="#89a2c6" font-family="monospace" font-size="16">github://boubakriibrahim/activity</text>
